<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/basic.css">
    <script>
        window.onload = ev => {
            document.getElementById('initSocket').onclick = () => {
                console.log('a');
                const ws = new WebSocket('ws://127.0.0.1:4312');

                ws.onopen = () => {
                    console.log('Abrindo uma conexão');
                    ws.send('sub_ram')
                }

                ws.onmessage = ev => {
                    console.log(ev.data);
                }

                ws.onerror = err => {
                    console.error(err);
                }
            }
        }
    </script>
    <title>Document</title>
</head>
<body>
    <header>
        <span>
            IFSP - GNSS
        </span>
    </header>

    <main>
        <div class="usage">
            <span class="ram"></span>
            <span class="cpu"></span>
        </div>

        <button id="initSocket">Ligar socket</button>
    </main>
    
    <footer>

    </footer>
</body>
</html>
